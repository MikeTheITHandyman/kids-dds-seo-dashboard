name: Nightly AI Visibility Harness
on:
  schedule:
    # Runs nightly at 08:15 UTC (03:15 AM CDT / 02:15 AM CST)
    - cron: "15 8 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Visibility Tracker
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 -X GET "https://kidsddsseo.netlify.app/api/cron/llm-tracker" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
