name: Weekly AI Visibility Harness
on:
  schedule:
    # Runs every Monday at 08:00 UTC (03:00 AM CDT / 02:00 AM CST)
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Visibility Tracker
        run: |
          curl --fail-with-body -X GET "https://kidsddsseo.netlify.app/api/cron/llm-tracker" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
